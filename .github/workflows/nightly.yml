name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-nightly-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: version
        name: Resolve nightly version
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list "v*" --sort=-v:refname)
          stable_version="$(node -p "require('./frontend/package.json').version")"
          if [[ -n "$latest_tag" ]]; then
            stable_version="${latest_tag#v}"
          fi
          IFS=. read -r major minor patch <<< "$stable_version"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${GITHUB_SHA:0:8}"
          version="${major}.${minor}.$((patch + 1))-nightly.${timestamp}.g${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-controller-image:
    if: github.ref == 'refs/heads/main'
    needs: resolve-nightly-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/local-studio-controller
          tags: |
            type=raw,value=nightly
            type=raw,value=${{ needs.resolve-nightly-version.outputs.version }}
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish-nightly:
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-nightly-version
      - publish-controller-image
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: npm run setup

      - name: Build unsigned nightly app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NIGHTLY_VERSION: ${{ needs.resolve-nightly-version.outputs.version }}
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.version="$NIGHTLY_VERSION"
          --config.extraMetadata.localStudioCommit=${{ github.sha }}

      - name: Sign nightly assets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NIGHTLY_VERSION: ${{ needs.resolve-nightly-version.outputs.version }}
        run: >-
          node scripts/project.mjs sign-release
          --version "$NIGHTLY_VERSION"
          --commit "${{ github.sha }}"
          --prepackaged "frontend/dist-desktop/mac-arm64/Local Studio.app"

      - name: Stage nightly assets
        env:
          NIGHTLY_VERSION: ${{ needs.resolve-nightly-version.outputs.version }}
        run: |
          output="frontend/dist-desktop"
          staging="release-nightly"
          base="Local Studio-${NIGHTLY_VERSION}-arm64"
          published_base="Local-Studio-${NIGHTLY_VERSION}-arm64"
          mkdir -p "$staging"
          cp "$output/${base}.dmg" "$staging/${published_base}.dmg"
          cp "$output/${base}.dmg.blockmap" "$staging/${published_base}.dmg.blockmap"
          cp "$output/${base}-mac.zip" "$staging/${published_base}-mac.zip"
          cp "$output/${base}-mac.zip.blockmap" "$staging/${published_base}-mac.zip.blockmap"
          cp "$output/latest-mac.yml" "$staging/latest-mac.yml"
          cp "$output/${base}.dmg" "$staging/Local-Studio-Nightly-arm64.dmg"
          grep -F "url: ${published_base}-mac.zip" "$staging/latest-mac.yml"
          grep -F "url: ${published_base}.dmg" "$staging/latest-mac.yml"

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ needs.resolve-nightly-version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/nightly-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "Developer ID signed rolling build of main at $GITHUB_SHA." \
            "Version: $NIGHTLY_VERSION" \
            "This build is signed but not notarized. macOS may require manual approval in System Settings → Privacy & Security." \
            > "$notes"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/nightly" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
              --jq '.assets[] | select(.name | endswith("-arm64-mac.zip.blockmap") | not) | .id' |
              while IFS= read -r asset_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Local Studio Nightly ($NIGHTLY_VERSION)" \
              --notes-file "$notes" \
              --draft=false \
              --prerelease \
              --latest=false
            gh release upload nightly release-nightly/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly release-nightly/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --verify-tag \
              --title "Local Studio Nightly ($NIGHTLY_VERSION)" \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi
