name: Weekly dev to main PR

# Monday 09:00 America/New_York (13:00 UTC): open (or refresh) the weekly
# dev -> main PR. Merging it runs CI on main, which triggers Release.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or refresh the dev -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev main
          ahead=$(git rev-list --count origin/main..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "dev has nothing main lacks — no PR needed"
            exit 0
          fi
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          title="Weekly release: dev -> main ($(date -u +%Y-%m-%d))"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title"
            echo "refreshed PR #$existing ($ahead commits)"
          else
            gh pr create --base main --head dev \
              --title "$title" \
              --body "Automated weekly promotion: $ahead commits from dev. Merging runs CI on main and cuts the release."
            echo "opened new PR ($ahead commits)"
          fi
