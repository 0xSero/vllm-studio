name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Conventional commit gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/project.mjs check-commits --range "$BASE_SHA..$HEAD_SHA"
      - name: Shared-contract duplication gate
        run: node scripts/project.mjs validate-contracts
      - name: Barrel/dir sibling structure gate
        run: node scripts/project.mjs validate-structure
      - name: Immutable workflow policy gate
        run: npm run check:workflow-pins

  controller:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: ./controller
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: ./controller
        run: bun run typecheck
      - name: Lint
        working-directory: ./controller
        run: bun run lint
      - name: Cleanup checks
        working-directory: ./controller
        run: bun run check
      - name: Tests
        working-directory: ./controller
        run: bun run test
  agent-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: ./services/agent-runtime
        run: bun install --frozen-lockfile
      - name: Install shared contract dependencies
        working-directory: ./shared
        run: bun install --frozen-lockfile
      - name: Build and test
        working-directory: ./services/agent-runtime
        run: bun run check
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: npm run setup
      - name: Production quality gate
        working-directory: ./frontend
        run: npm run check:quality
      - name: Install browser test dependencies
        working-directory: ./frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser acceptance tests
        working-directory: ./frontend
        run: npm run test:e2e:controller && npm run test:e2e:providers

  desktop-package:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: npm run setup
      - name: Build unsigned test package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.localStudioCommit=${{ github.sha }}
      - name: Smoke packaged desktop
        run: >-
          npm --prefix frontend run desktop:smoke --
          --app "${{ github.workspace }}/frontend/dist-desktop/mac-arm64/Local Studio.app"
          --expected-version "$(node -p 'require("./frontend/package.json").version')"
      - name: Archive exact-main test package
        run: >-
          ditto -c -k --keepParent
          "frontend/dist-desktop/mac-arm64/Local Studio.app"
          "local-studio-${{ github.sha }}-arm64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-studio-${{ github.sha }}-arm64
          path: local-studio-${{ github.sha }}-arm64.zip
          if-no-files-found: error
          retention-days: 7

  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified --json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: javascript, typescript
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
