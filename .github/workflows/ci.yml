name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup
        with: {node: "true", bun: "false"}
      - name: Conventional commit gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == dev ]]; then
            node scripts/project.mjs check-commits --range "$BASE_SHA..$HEAD_SHA" --exclude origin/dev
          elif [[ "${{ github.event_name }}" == pull_request ]]; then
            node scripts/project.mjs check-commits --range "$BASE_SHA..$HEAD_SHA" --exclude origin/main
          else
            node scripts/project.mjs check-commits --range "$BASE_SHA..$HEAD_SHA"
          fi
      - run: node scripts/project.mjs validate-contracts
      - run: node scripts/project.mjs validate-structure
  workspace:
    if: github.event_name != 'schedule'
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            install: bun install --frozen-lockfile --cwd controller
            check: bun run --cwd controller typecheck && bun run --cwd controller lint && bun run --cwd controller check
          - component: agent-runtime
            install: bun install --frozen-lockfile --cwd services/agent-runtime && bun install --frozen-lockfile --cwd shared
            check: bun run --cwd services/agent-runtime check
          - component: frontend
            node: "true"
            install: npm run setup
            check: npm --prefix frontend run check:quality
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node || 'false' }}
          install: ${{ matrix.install }}
      - run: ${{ matrix.check }}
  desktop-package:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {node: "true", install: npm run setup}
      - name: Build unsigned package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.localStudioCommit=${{ github.sha }}
      - run: ditto -c -k --keepParent "frontend/dist-desktop/mac-arm64/Local Studio.app" "local-studio-${{ github.sha }}-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: local-studio-${{ github.sha }}-arm64
          path: local-studio-${{ github.sha }}-arm64.zip
          if-no-files-found: error
          retention-days: 7
  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified --json
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: {languages: "javascript, typescript"}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with: {category: /language:javascript-typescript}
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
