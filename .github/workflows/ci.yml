name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Conventional commit gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/project.mjs check-commits --range "$BASE_SHA..$HEAD_SHA"
      - name: Shared-contract duplication gate
        run: node scripts/project.mjs validate-contracts
      - name: Barrel/dir sibling structure gate
        run: node scripts/project.mjs validate-structure

  controller:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: ./controller
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: ./controller
        run: bun run typecheck
      - name: Lint
        working-directory: ./controller
        run: bun run lint
      - name: Cleanup checks
        working-directory: ./controller
        run: bun run check
      - name: Tests
        working-directory: ./controller
        run: bun run test
  agent-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: ./services/agent-runtime
        run: bun install --frozen-lockfile
      - name: Install shared contract dependencies
        working-directory: ./shared
        run: bun install --frozen-lockfile
      - name: Build and test
        working-directory: ./services/agent-runtime
        run: bun run check
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: npm run setup
      - name: Production quality gate
        working-directory: ./frontend
        run: npm run check:quality
      - name: Install browser test dependencies
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        working-directory: ./frontend
        run: npm run test:e2e:controller && npm run test:e2e:providers

  desktop-package:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: npm run setup
      - name: Build unsigned test package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.localStudioCommit=${{ github.sha }}
      - name: Smoke packaged desktop
        run: >-
          npm --prefix frontend run desktop:smoke --
          --app "${{ github.workspace }}/frontend/dist-desktop/mac-arm64/Local Studio.app"
          --expected-version "$(node -p 'require("./frontend/package.json").version')"
      - name: Archive exact-main test package
        run: >-
          ditto -c -k --keepParent
          "frontend/dist-desktop/mac-arm64/Local Studio.app"
          "local-studio-${{ github.sha }}-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: local-studio-${{ github.sha }}-arm64
          path: local-studio-${{ github.sha }}-arm64.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: npm run setup
      - name: Repository automation gate
        run: npm run check:automation
      - name: Controller checks and tests
        working-directory: ./controller
        run: bun run typecheck && bun run lint && bun run check && bun run test
      - name: Agent runtime checks and tests
        working-directory: ./services/agent-runtime
        run: bun run check
      - name: Frontend and desktop checks and tests
        working-directory: ./frontend
        run: npm run lint && npm run typecheck && npm run typecheck:desktop && npm run typecheck:extensions && npm run test
      - name: Build frontend and desktop
        working-directory: ./frontend
        run: npm run desktop:build
      - name: Build unsigned Windows package
        working-directory: ./frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --dir --win --x64 --config desktop/electron-builder.yml
      - name: Smoke packaged Windows desktop
        working-directory: ./frontend
        run: |
          $version = node -p "require('./package.json').version"
          npm run desktop:smoke -- --app "${{ github.workspace }}\frontend\dist-desktop\win-unpacked\Local Studio.exe" --expected-version $version

  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified --json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
