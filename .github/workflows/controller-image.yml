name: Controller Image

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/publish-daytona-snapshot/**
      - .github/workflows/controller-image.yml
      - .github/workflows/nightly.yml
      - .github/workflows/release.yml
      - controller/**
      - contracts/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build controller image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/local-studio-controller
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./controller/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  snapshot:
    name: Publish Daytona snapshot
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/publish-daytona-snapshot
        with:
          api-key: ${{ secrets.DAYTONA_API_KEY }}
          image: ghcr.io/${{ github.repository_owner }}/local-studio-controller:sha-${{ github.sha }}
          snapshot-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('local-studio-worker-{0}', github.ref_name) || format('local-studio-worker-dev-{0}', github.sha) }}
          sandbox-class: container
