name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: release-version
        name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Reject tags outside current main
        run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: npm run setup

      - name: Build unsigned release app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.version=${{ steps.release-version.outputs.version }}
          --config.extraMetadata.localStudioCommit=${{ github.sha }}

      - name: Verify unsigned updater metadata
        run: |
          update_config="frontend/dist-desktop/mac-arm64/Local Studio.app/Contents/Resources/app-update.yml"
          test -f "$update_config"
          grep -Fx "owner: jake-molnia" "$update_config"
          grep -Fx "repo: local-studio" "$update_config"
          grep -Fx "provider: github" "$update_config"
          grep -Fx "updaterCacheDirName: frontend-updater" "$update_config"

      - name: Archive unsigned release app
        run: >-
          ditto -c -k --keepParent
          "frontend/dist-desktop/mac-arm64/Local Studio.app"
          "local-studio-unsigned-${{ github.sha }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-studio-unsigned-${{ github.sha }}
          path: local-studio-unsigned-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: macos-15
    environment: release-signing
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reject tags outside current main
        run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install signing dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-studio-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-release

      - name: Extract unsigned release app
        run: >-
          ditto -x -k
          "${{ runner.temp }}/unsigned-release/local-studio-unsigned-${{ github.sha }}.zip"
          "${{ runner.temp }}/unsigned-release/app"

      - name: Sign release assets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: >-
          node scripts/project.mjs sign-release
          --version ${{ needs.build.outputs.release_version }}
          --commit "$RELEASE_SHA"
          --prepackaged "${{ runner.temp }}/unsigned-release/app/Local Studio.app"

      - name: Stage signed release assets
        run: >-
          node scripts/project.mjs stage-release
          --version ${{ needs.build.outputs.release_version }}
          --commit "$RELEASE_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-studio-release-assets-${{ github.sha }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reject tags outside current main
        run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-studio-release-assets-${{ github.sha }}
          path: release-staging

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-staging/*
          --repo "$GITHUB_REPOSITORY"
          --title "Local Studio $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          --latest
