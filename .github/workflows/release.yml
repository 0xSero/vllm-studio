name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
concurrency:
  group: release-main
  cancel-in-progress: true
env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.next-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - run: git checkout -B main "$RELEASE_SHA"
      - run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"
      - uses: ./.github/actions/setup
        with:
          node: "true"
          install: npm run setup
      - id: next-release
        name: Determine release version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npm run release:semantic -- --dry-run 2>&1 | tee semantic-release.log
          version="$(sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' semantic-release.log | tail -1)"
          if [ -n "$version" ]; then echo "version=$version" >> "$GITHUB_OUTPUT"; fi
      - name: Build unsigned release app
        if: steps.next-release.outputs.version != ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.version=${{ steps.next-release.outputs.version }}
          "--config.extraMetadata.localStudioCommit=$RELEASE_SHA"
      - name: Verify unsigned updater metadata
        if: steps.next-release.outputs.version != ''
        run: |
          file="frontend/dist-desktop/mac-arm64/Local Studio.app/Contents/Resources/app-update.yml"
          test -f "$file"
          grep -Fx "owner: sybil-solutions" "$file"
          grep -Fx "repo: local-studio" "$file"
          grep -Fx "provider: github" "$file"
          grep -Fx "updaterCacheDirName: frontend-updater" "$file"
      - name: Archive unsigned release app
        if: steps.next-release.outputs.version != ''
        run: ditto -c -k --keepParent "frontend/dist-desktop/mac-arm64/Local Studio.app" "local-studio-unsigned-$RELEASE_SHA.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.next-release.outputs.version != ''
        with:
          name: local-studio-unsigned-${{ env.RELEASE_SHA }}
          path: local-studio-unsigned-${{ env.RELEASE_SHA }}.zip
          if-no-files-found: error
          retention-days: 1
  sign:
    needs: build
    if: needs.build.outputs.release_version != ''
    runs-on: macos-15
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - run: git checkout -B main "$RELEASE_SHA"
      - run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"
      - uses: ./.github/actions/setup
        with:
          node: "true"
          bun: "false"
          install: npm --prefix frontend ci --ignore-scripts --legacy-peer-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: local-studio-unsigned-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/unsigned-release
      - run: ditto -x -k "${{ runner.temp }}/unsigned-release/local-studio-unsigned-$RELEASE_SHA.zip" "${{ runner.temp }}/unsigned-release/app"
      - name: Sign and notarize release assets
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: node scripts/project.mjs sign-release --version ${{ needs.build.outputs.release_version }} --commit "$RELEASE_SHA" --prepackaged "${{ runner.temp }}/unsigned-release/app/Local Studio.app"
      - run: node scripts/project.mjs stage-release --version ${{ needs.build.outputs.release_version }} --commit "$RELEASE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-studio-release-assets-${{ env.RELEASE_SHA }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, sign]
    if: needs.build.outputs.release_version != ''
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - run: git checkout -B main "$RELEASE_SHA"
      - run: node scripts/project.mjs assert-release-main --commit "$RELEASE_SHA"
      - uses: ./.github/actions/setup
        with:
          node: "true"
          bun: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: local-studio-release-assets-${{ env.RELEASE_SHA }}
          path: release-staging
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:semantic
