name: Setup JavaScript toolchain
description: Set up pinned Node/Bun and optional dependencies
inputs:
  node:
    description: Set up Node.js
    default: "false"
  bun:
    description: Set up Bun
    default: "true"
  install:
    description: Install command; empty skips
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.19.0
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - if: inputs.install != ''
      shell: bash
      run: ${{ inputs.install }}
