appId: org.local.studio.desktop
productName: Local Studio
asar: true
compression: maximum
electronLanguages:
  - en

afterPack: ./desktop/project.mjs

files:
  - desktop/dist/main.js
  - desktop/dist/preload.js
  - package.json
  - "!node_modules/**"

extraResources:
  - from: desktop/resources/app-update.yml
    to: app-update.yml
  - from: ../services/agent-runtime/dist/standalone.mjs
    to: app/agent-runtime/standalone.mjs
  - from: ../services/agent-runtime/dist/node_modules/playwright-core
    to: app/agent-runtime/node_modules/playwright-core
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/chromium-bidi
    to: app/agent-runtime/node_modules/chromium-bidi
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/chromium-bidi/node_modules/zod
    to: app/agent-runtime/node_modules/chromium-bidi/node_modules/zod
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/mitt
    to: app/agent-runtime/node_modules/mitt
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/devtools-protocol
    to: app/agent-runtime/node_modules/devtools-protocol
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/@silvia-odwyer/photon-node
    to: app/agent-runtime/node_modules/@silvia-odwyer/photon-node
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/undici
    to: app/agent-runtime/node_modules/undici
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/@lydell
    to: app/agent-runtime/node_modules/@lydell
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  # Pi's extension loader (jiti alias mode) eagerly require.resolve()s typebox
  # and import.meta.resolve()s the pi packages from standalone.mjs's directory
  # before loading ANY extension file. Without these four next to the bundle,
  # every bundled pi extension fails with "Cannot find module 'typebox'".
  - from: ../services/agent-runtime/dist/node_modules/typebox
    to: app/agent-runtime/node_modules/typebox
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/@earendil-works/pi-agent-core
    to: app/agent-runtime/node_modules/@earendil-works/pi-agent-core
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/@earendil-works/pi-tui
    to: app/agent-runtime/node_modules/@earendil-works/pi-tui
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: ../services/agent-runtime/dist/node_modules/@earendil-works/pi-ai
    to: app/agent-runtime/node_modules/@earendil-works/pi-ai
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: node_modules/@lydell/node-pty
    to: desktop-runtime/node_modules/@lydell/node-pty
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: node_modules/@lydell/node-pty-${platform}-${arch}
    to: desktop-runtime/node_modules/@lydell/node-pty-${platform}-${arch}
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: .next/standalone
    to: app/frontend/.next/standalone
    filter:
      - "**/*"
      - "!data/**"
      - "!frontend/data/**"
      - "!**/dist-desktop/**"
      - "!**/*.log"
      - "!**/*.{map,ts,mts,cts}"
      - "!**/.next/cache/**"
      - "!**/.next/trace"
  - from: .next/static
    to: app/frontend/.next/standalone/frontend/.next/static
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/frontend/public
    filter:
      - "**/*"
  - from: ../scripts/install-controller.sh
    to: app/scripts/install-controller.sh
  - from: desktop/resources/pi-extensions
    to: desktop/resources/pi-extensions
    filter:
      - "**/*"
  - from: desktop/resources/mcp
    to: desktop/resources/mcp
    filter:
      - "**/*"
  - from: desktop/resources/plugins
    to: desktop/resources/plugins
    filter:
      - "**/*"
  - from: desktop/resources/skills
    to: desktop/resources/skills
    filter:
      - "**/*"

directories:
  output: dist-desktop
  buildResources: desktop/resources

mac:
  icon: desktop/resources/icon.icns
  category: public.app-category.developer-tools
  identity: "Jacob Molnia (MS5PHQJD6W)"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/resources/entitlements.mac.plist
  entitlementsInherit: desktop/resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Record your own voice to create a private, local voice profile.

dmg:
  sign: true

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - AppImage
