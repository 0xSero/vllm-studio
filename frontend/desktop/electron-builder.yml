appId: org.local.studio.desktop
productName: Local Studio
asar: true
compression: maximum
electronLanguages:
  - en

afterPack: ./desktop/project.mjs

files:
  - desktop/dist/main.js
  - desktop/dist/preload.js
  - package.json
  - "!node_modules/**"

extraResources:
  - from: desktop/resources/app-update.yml
    to: app-update.yml
  - from: desktop/dist/browser-host.js
    to: app/browser-host.js
  - from: ../controller/zig-out/bin
    to: app/controller
    filter:
      - "local-studio-controller*"
      - "secretspec*"
  - from: node_modules/@lydell/node-pty
    to: desktop-runtime/node_modules/@lydell/node-pty
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: node_modules/@lydell/node-pty-${platform}-${arch}
    to: desktop-runtime/node_modules/@lydell/node-pty-${platform}-${arch}
    filter:
      - "**/*"
      - "!**/*.{map,ts,mts,cts}"
  - from: .next/standalone
    to: app/frontend/.next/standalone
    filter:
      - "**/*"
      - "!data/**"
      - "!frontend/data/**"
      - "!**/dist-desktop/**"
      - "!**/*.log"
      - "!**/*.{map,ts,mts,cts}"
      - "!**/{docs,doc,examples,example,test,tests,__tests__}/**"
      - "!**/{README,Readme,readme,CHANGELOG,Changelog,changelog,CHANGES,Changes,changes,HISTORY,History,history}"
      - "!**/{README,Readme,readme,CHANGELOG,Changelog,changelog,CHANGES,Changes,changes,HISTORY,History,history}.{md,markdown,txt}"
      - "!**/.next/cache/**"
      - "!**/.next/trace"
  - from: .next/static
    to: app/frontend/.next/standalone/frontend/.next/static
    filter:
      - "**/*"
  - from: public
    to: app/frontend/.next/standalone/frontend/public
    filter:
      - "**/*"
  - from: ../scripts/install-controller.sh
    to: app/scripts/install-controller.sh
  - from: desktop/resources/skills
    to: desktop/resources/skills
    filter:
      - "**/*"

directories:
  output: dist-desktop
  buildResources: desktop/resources

mac:
  icon: desktop/resources/icon.icns
  category: public.app-category.developer-tools
  identity: "Jacob Molnia (MS5PHQJD6W)"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/resources/entitlements.mac.plist
  entitlementsInherit: desktop/resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Record your own voice to create a private, local voice profile.

dmg:
  sign: true

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - AppImage
